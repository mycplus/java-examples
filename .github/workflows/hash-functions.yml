name: hash-functions

on:
  push:
    paths: ['cryptography/hash-functions/**', '.github/workflows/hash-functions.yml']
  pull_request:
    paths: ['cryptography/hash-functions/**', '.github/workflows/hash-functions.yml']

defaults:
  run:
    working-directory: cryptography/hash-functions

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile (lint warnings are errors)
        shell: bash
        run: javac --release 17 -Xlint:all -Werror -d build src/*.java tests/*.java
      - name: All vectors
        shell: bash
        run: java -ea -cp build DigestTest tests/vectors | diff --strip-trailing-cr - tests/expected/DigestTest.txt
      - name: Demo prints the article's output
        shell: bash
        run: java -cp build DigestDemo | diff --strip-trailing-cr - tests/expected/DigestDemo.txt
