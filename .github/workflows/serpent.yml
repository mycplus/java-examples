name: serpent

on:
  push:
    paths: ['cryptography/serpent/**', '.github/workflows/serpent.yml']
  pull_request:
    paths: ['cryptography/serpent/**', '.github/workflows/serpent.yml']

defaults:
  run:
    working-directory: cryptography/serpent

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile (lint warnings are errors)
        shell: bash
        run: javac --release 17 -Xlint:all -Werror -d build src/*.java tests/*.java bench/*.java
      - name: All 1,043 test vectors and key validation
        shell: bash
        run: java -ea -cp build SerpentTest tests/vectors/serpent_nessie.txt
      - name: Demo prints the article's output
        shell: bash
        run: java -cp build SerpentDemo | diff --strip-trailing-cr - tests/expected/SerpentDemo.txt
