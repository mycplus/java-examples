name: selection-sort

on:
  push:
    paths: ['sorting/selection-sort/**', '.github/workflows/selection-sort.yml']
  pull_request:
    paths: ['sorting/selection-sort/**', '.github/workflows/selection-sort.yml']

defaults:
  run:
    working-directory: sorting/selection-sort

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile (lint warnings are errors)
        shell: bash
        run: javac --release 17 -Xlint:all -Werror -d build src/*.java tests/*.java
      - name: Tests against Arrays.sort
        shell: bash
        run: java -ea -cp build SelectionSortTest
      - name: Program prints the article's output
        shell: bash
        run: java -cp build SelectionSort | diff --strip-trailing-cr - tests/expected/SelectionSort.txt
