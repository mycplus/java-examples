name: stack

on:
  push:
    paths: ['data-structures/stack/**', '.github/workflows/stack.yml']
  pull_request:
    paths: ['data-structures/stack/**', '.github/workflows/stack.yml']

defaults:
  run:
    working-directory: data-structures/stack

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile (lint warnings are errors)
        shell: bash
        run: javac --release 17 -Xlint:all -Werror -d build src/*.java tests/*.java pitfalls/*.java
      - name: Unit tests
        shell: bash
        run: java -ea -cp build StackTest
      - name: Demo prints the article's output
        shell: bash
        run: java -cp build StackDemo | diff --strip-trailing-cr - tests/expected/StackDemo.txt
      - name: Popped objects are reclaimed only when the slot is cleared
        shell: bash
        run: |
          java -cp build Loitering | tee loitering.txt
          grep -q "slot cleared on pop: reclaimed=true" loitering.txt
          grep -q "slot left in array:  reclaimed=false" loitering.txt
